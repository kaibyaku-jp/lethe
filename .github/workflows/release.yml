name: Release

# Pushing a tag such as v0.1.0 publishes the gem to RubyGems.org
# through trusted publishing and creates a GitHub release. See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions: {}

# Never run two releases at once or cancel one halfway through pushing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # trusted publishing to RubyGems.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: "3.4"
          # No dependency cache here: a cache written by another workflow
          # must not be able to change what gets published.
          bundler-cache: false
      - run: bundle install
      - name: Check that the tag matches the version
        run: |
          version=$(ruby -r ./lib/lethe/version -e 'print Lethe::VERSION')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - run: bundle exec rake
      - run: bundle exec rake package
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push the gem
        run: gem push "pkg/lethe-${GITHUB_REF_NAME#v}.gem"
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" pkg/*.gem --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
