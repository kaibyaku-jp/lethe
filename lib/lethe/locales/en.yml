en:
  lethe:
    errors:
      no_definitions_file: "lethe: %{path} not found. Declare your policies there, or set Lethe.configuration.definition_path."
      load_failed: "lethe: could not load %{path}: %{error}"
      ledger_required: "lethe: %{table} is missing; keep ..., for: needs it to know when a subject was erased. Run bin/rails generate lethe:install and migrate."
      no_definition: "lethe: there is no Lethe.define for %{subject}"
      foreign_key_cycle: "lethe: foreign keys between %{tables} form a cycle, so there is no order to delete them in; use cascade: true or remove one of the keys"
    vias:
      foreign_key: foreign key
      association: association
      join_table: join table
      polymorphic: polymorphic association
      polymorphic_guess: polymorphic belongs_to
      attachment: attachment
      column_name: column name
      declared: declaration
    check:
      summary: "%{subject}: %{count} references (%{vias})"
      covered: "%{count} have a policy"
      missing: "no policy (found by %{vias})"
      guess: "guessed from the %{vias}; declare a policy, or `ignore` it with a reason if it does not point at %{subject}"
      subject_missing: "no `subject` declaration; say how the %{subject} row itself goes"
      totals: "%{problems} problems, %{guesses} to confirm."
      clean: "No problems."
    messages:
      subject_not_a_model: "%{subject} is not an Active Record model with a table"
      no_association: "%{subject} has no association :%{name}"
      through_association: ":%{name} goes through another association; declare the table it goes through instead"
      association_class_missing: "the class of association :%{name} cannot be loaded"
      belongs_to_association: ":%{name} is a belongs_to; it points away from %{subject}, not at it"
      no_attachment: "%{subject} has no attachment :%{name}"
      no_table: "there is no table %{table}"
      no_column: "%{table} has no column %{column}"
      reason_required: "%{action} needs a reason:"
      reason_not_string: "reason: must be a String"
      set_required: "scrub needs set: with the columns to overwrite"
      where_not_hash: "where: must be a non-empty Hash of columns"
      unknown_column: "%{option}: %{table} has no column %{column}"
      retention_not_duration: "for: must be a duration such as 2.years"
      contradiction: "%{key} already has a different policy at %{other}; limit one of them with where:"
      polymorphic_type_required: "%{key} is polymorphic; add where: { %{type_column}: \"%{subject_type}\" } so other types' rows stay"
      cascade_needs_model: "cascade: true needs a model for %{table}; without one, leave cascade out"
      computed_set_needs_primary_key: "a Proc in set: needs %{table} to have a primary key, to update one row at a time"
      kept_rows_block_destroy: "%{key} has a foreign key to %{subject}, so its rows cannot stay when subject destroy: true deletes the row; soft delete it instead"
      subject_both: "subject cannot both destroy: and soft_delete:"
      subject_neither: "subject needs destroy: true or soft_delete: :column"
      subject_scrub_not_hash: "subject scrub: must be a Hash of columns"
    export:
      title: "What happens when a %{subject} leaves"
      generated: "Generated by lethe from %{path}. Do not edit by hand; run bin/rails lethe:export."
      data: Data
      action: When they leave
      retention: Kept for
      reason: Reason
      subject_row: "The %{subject} itself"
      attachment: "%{name} (attachment)"
      column_suffix: "%{label} (%{column})"
      destroy: Deleted
      destroy_attachment: Deleted
      scrub: "Kept, with %{columns} overwritten"
      keep: Kept
      soft_delete: "Kept as deleted (%{column})"
      soft_delete_scrub: "Kept as deleted (%{column}), with %{columns} overwritten"
      where: "%{action}, where %{conditions}"
      list_separator: ", "
      parts:
        years: "%{count} years"
        months: "%{count} months"
        weeks: "%{count} weeks"
        days: "%{count} days"
        hours: "%{count} hours"
        minutes: "%{count} minutes"
        seconds: "%{count} seconds"
